name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm distribution: @young1lin/dsh-cc-otel (the dsh plugin bundle) plus six
  # @young1lin/cc-otel-<os>-<cpu> binary packages assembled from the goreleaser
  # artifacts, so npm users get byte-identical binaries to the GitHub release.
  #
  # Authentication is npm Trusted Publishing (OIDC): the GitHub Actions OIDC
  # token identifies this workflow to npm — no NPM_TOKEN / NODE_AUTH_TOKEN
  # secret anywhere, and provenance is generated automatically by npm.
  # One-time bootstrap per package (7 in total, same as dsh-cc):
  #   1. the first publish of each NEW package name is done by hand (a trusted
  #      publisher cannot be configured before the package exists): assemble
  #      locally with scripts/build-npm.mjs, then npm publish with OTP;
  #   2. npmjs.com -> package Settings -> Trusted publishing -> add
  #      user young1lin / repo cc-otel / workflow publish.yml. The filename
  #      must match the npmjs trusted-publisher registration exactly — the
  #      GitHub OIDC claim carries the workflow FILENAME, not the workflow
  #      name, so a mismatch fails the token exchange with ENEEDAUTH.
  # Afterwards every vX.Y.Z tag publishes tokenlessly. Prerelease tags
  # (v1.2.3-rc.1) publish under the "next" dist-tag, never latest.
  #
  # Node 24 because Trusted Publishing needs npm >= 11.5.1; Node 22's bundled
  # npm is older, so the step below upgrades npm only when below that bar.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing / provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1 (Trusted Publishing requirement)
        run: |
          npm --version
          if [ "$(printf '%s\n' '11.5.1' "$(npm --version)" | sort -V | head -n1)" != '11.5.1' ]; then
            npm install -g npm@latest
            npm --version
          fi

      - name: Download goreleaser artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo young1lin/cc-otel --dir dist/release --pattern 'cc-otel_*'

      - name: Assemble npm packages
        run: node scripts/build-npm.mjs --version "${GITHUB_REF_NAME#v}" --artifacts dist/release --out dist/npm

      - name: Publish to npm (Trusted Publishing — no secrets)
        run: |
          set -euo pipefail
          # setup-node writes '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}'
          # into the runner .npmrc. With an authToken present npm never
          # attempts the OIDC exchange, and a token-authed PUT from CI gets
          # a flat 404 (v0.1.4 first attempt). Strip it so npm >= 11.5.1
          # falls back to Trusted Publishing.
          unset NODE_AUTH_TOKEN
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          tag_flag=""
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            tag_flag="--tag next"
          fi
          for pkg in dist/npm/*/; do
            name=$(node -p "require('./${pkg}package.json').name")
            version=$(node -p "require('./${pkg}package.json').version")
            echo "::group::publish ${name}@${version}"
            # Idempotent: the one-time manual bootstrap (first publish of a
            # new package name needs a human OTP) and workflow re-runs must
            # converge instead of failing on an already-published version.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "already published — skipping"
            else
              # --provenance forces npm to request the GitHub OIDC token,
              # which is also what authenticates Trusted Publishing; without
              # it a tokenless publish dies with ENEEDAUTH.
              (cd "${pkg}" && npm publish --access public --provenance ${tag_flag})
            fi
            echo "::endgroup::"
          done
